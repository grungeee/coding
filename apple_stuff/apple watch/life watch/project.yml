name: Life Watch
options:
  bundleIdPrefix: com.grungeee
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0

targets:
  "Life Watch":
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    info:
      path: Resources/App/Info.plist
      properties:
        CFBundleDisplayName: Life Watch
        WKApplication: true
        WKWatchOnly: true
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Resources/App/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grungeee.LifeWatch.watchkitapp
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_DEBUG_DYLIB: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        TARGETED_DEVICE_FAMILY: 4
    dependencies:
      - target: "Life Watch Complications"

  "Life Watch Complications":
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    info:
      path: Resources/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Life Watch
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: Sources/Widgets
      - path: Sources/Shared
      - path: Resources/Widgets/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grungeee.LifeWatch.watchkitapp.Complications
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        CODE_SIGN_STYLE: Automatic
        ENABLE_DEBUG_DYLIB: NO
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks @executable_path/../../../../Frameworks
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 4

schemes:
  "Life Watch":
    build:
      targets:
        "Life Watch": all
        "Life Watch Complications": all
    run:
      config: Debug
    archive:
      config: Release
